<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study and Expand Sequence</title>
  <style>
    * {
      box-sizing:border-box;
    }
    body {
      font-family:Arial,Helvetica,sans-serif;
    }
    #input,#output {
      margin:0;
      width:100%;
      min-width:480px;
      font-family:"Liberation Mono","Courier New",Courier,monospace;
      font-size:13.5px;
      text-align:left;
      white-space:pre;
      border:1px solid black;
      resize:vertical;
      padding:4px;
    }
    #controls {
      display:flex;
      flex-wrap:wrap;
      column-gap:60px;
      margin:4px 0 12px 0;
    }
    #controls>div {
      display:flex;
      flex-wrap:wrap;
    }
    #controls label {
      display:inline-block;
    }
    #controls input[type=text] {
      width:150px;
    }
    #controls input[type=number] {
      width:60px;
    }
  </style>
  <script src="./script.js"></script>
</head>
<body>
  <h1>Study and Expand Sequence (仮)</h1>
  <textarea id="input" rows="2" oninput="requestAnimationFrame(handlekey)" contentEditable>1,4,16,19,16</textarea>
  <div id="controls">
    <div style="column-gap:16px">
      <label>N <input id="inputn" type="text" oninput="requestAnimationFrame(handlekey)" value="3"></label>
      <label>Max dimensions <input id="maxDimensions" type="number" min=0 value=10 step=1 oninput="requestAnimationFrame(handlekey)"></label>
      <label>Remove limit to N <input id="noLimitToN" type="checkbox" oninput="requestAnimationFrame(handlekey)"></label>
      <label>Use leg-based test for ascension <input id="legBasedAscension" type="checkbox" oninput="requestAnimationFrame(handlekey)"></label>
      <label>Auto <input id="automaticallyExpandOnChange" type="checkbox" checked oninput="requestAnimationFrame(handlekey)"></label>
    </div>
    <div style="column-gap:32px">
      <button onclick="expandall(false)">Expand</button>
      <button onclick="generateRandom()">Randomize</button>
    </div>
  </div>
  <textarea id="output" rows="2" readonly></textarea>
  <div id="errout"></div>
  <div id="debugout" style="display:none"></div>
  <p>"Inspired by ω-Y sequence by Yukito"</p>
  <p>Version 1.1 <span style="font-size:small;color:gray;margin-left:10px;">2024/08/31</s></p>
</body>
</html>
